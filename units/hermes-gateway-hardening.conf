# Common hardening of all Hermes Agent gateways. Installed by "hermes-agent-lock.sh --host" as
# /etc/systemd/system/hermes-gateway-.service.d/10-hardening.conf; systemd applies it to every
# hermes-gateway-*.service. Do not edit the installed copy; change this template and run the lock again.
# Per agent, hermes-gateway-<agent>.service.d/20-agent.conf adds ReadWritePaths (profile and more),
# BindPaths (/run/user/<uid>) and memory limits.
# Worker scopes that the gateway starts with "systemd-run --user --scope" inherit the namespace,
# NoNewPrivileges, capabilities and seccomp filter; their memory and task limits are on user-<uid>.slice.
[Service]
Environment=PATH=/opt/hermes-agent/venv/bin:/opt/hermes-agent/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
UMask=0007
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=tmpfs
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
MemoryHigh=768M
MemoryMax=1G
TasksMax=512
