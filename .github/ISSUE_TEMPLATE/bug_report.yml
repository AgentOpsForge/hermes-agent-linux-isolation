name: Bug report
description: An error or omission in this guide or its scripts
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is for problems in **this guide**. Problems in Hermes Agent itself belong in the
        [Hermes Agent issue tracker](https://github.com/NousResearch/hermes-agent/issues).
        Security problems: do not open an issue, see [SECURITY.md](https://github.com/AgentOpsForge/hermes-agent-linux-isolation/blob/main/SECURITY.md).
        Remove host names, addresses, user names, tokens and other private data from everything you paste.
  - type: input
    id: chapter
    attributes:
      label: Chapter or script
      placeholder: e.g. chapter 6, agent-verify.sh
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Commands as you ran them
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      description: Output of `hermes --version` and the git tag or commit
    validations:
      required: true
  - type: input
    id: patches
    attributes:
      label: Local patches applied
      placeholder: e.g. P-01 to P-07, or none
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and systemd version
      placeholder: e.g. Debian 13, systemd 257
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Output of agent-verify.sh (redacted)
      description: Only the failed checks and the summary line, with private data removed
      render: text
