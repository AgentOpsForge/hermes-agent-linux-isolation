name: Feature request
description: Suggest an addition or change to the guide
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: isolation
    attributes:
      label: Effect on isolation between agents
      description: Does the proposal add access, shared paths, sockets, groups or credentials between agents or with the host?
    validations:
      required: true
